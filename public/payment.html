<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Payment | Kevinz Hub</title><link rel="stylesheet" href="/css/style.css"></head>
<body><nav class="navbar"><div class="container nav-inner"><a class="logo" href="/">Kevinz Hub</a></div></nav>
<main class="section container"><h1>Payment Instructions</h1><div id="instructions" class="notice">Loading payment details...</div>
<form id="payment" class="form-card"><input type="hidden" name="order_id" id="order_id"><input type="hidden" name="amount" id="amount">
<label>Payment method</label><select name="payment_method" required><option>Mobile Money</option><option>Airtel Money</option></select>
<label>Transaction reference</label><input name="payment_reference" required>
<label>Phone used to pay</label><input name="customer_phone" required>
<button class="btn">Submit payment for verification</button><p id="message"></p></form></main>
<script src="/js/main.js"></script><script>
const params=new URLSearchParams(location.search);
const orderId=params.get("order_id"), amount=params.get("amount");
document.getElementById("order_id").value=orderId; document.getElementById("amount").value=amount;
getJSON("/api/payments/settings").then(s=>{
 document.getElementById("instructions").innerHTML=`<strong>Amount:</strong> ${money(amount)}<br>Send payment to:<br><strong>MTN:</strong> ${s.mtn_number}<br><strong>Airtel:</strong> ${s.airtel_number}<br><br>After paying, enter your transaction reference below.`;
});
document.getElementById("payment").addEventListener("submit",async e=>{
 e.preventDefault(); const body=Object.fromEntries(new FormData(e.target).entries());
 try { const result=await getJSON("/api/payments",{method:"POST",body:JSON.stringify(body)}); document.getElementById("message").textContent=result.message; e.target.reset(); }
 catch(err){document.getElementById("message").textContent=err.message;}
});
</script></body></html>
