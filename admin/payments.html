<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Manage Payments</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="section container"><h1>Payments</h1><a href="/admin/dashboard.html">Dashboard</a><div id="payments"></div></main>
<script src="/js/main.js"></script><script>
async function load(){const rows=await getJSON("/api/payments");document.getElementById("payments").innerHTML=`<table><tr><th>ID</th><th>Order</th><th>Amount</th><th>Reference</th><th>Status</th><th>Action</th></tr>${rows.map(p=>`<tr><td>${p.id}</td><td>${p.order_id}</td><td>${money(p.amount)}</td><td>${p.payment_reference}</td><td>${p.status}</td><td><button class="btn" onclick="verify(${p.id},'Paid')">Approve</button> <button class="btn secondary" onclick="verify(${p.id},'Rejected')">Reject</button></td></tr>`).join("")}</table>`;}
async function verify(id,status){await getJSON("/api/payments/"+id+"/status",{method:"PUT",body:JSON.stringify({status})});load();}
load();
</script></body></html>
