<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard | Kevinz Hub</title><link rel="stylesheet" href="/css/style.css"></head>
<body><main class="section container"><h1>Administrator Dashboard</h1><p><a class="btn" href="/admin/products.html">Manage Products</a> <a class="btn" href="/admin/orders.html">Manage Orders</a> <a class="btn" href="/admin/payments.html">Manage Payments</a> <button class="btn secondary" onclick="logout()">Logout</button></p><div id="status"></div></main>
<script src="/js/main.js"></script><script>
getJSON("/api/auth/me").then(data=>{if(!data.admin) location.href="/login.html"; else document.getElementById("status").textContent="Logged in as "+data.admin.email;});
function logout(){getJSON("/api/auth/logout",{method:"POST"}).then(()=>location.href="/login.html");}
</script>
  <script src="/js/footer.js"></script>
</body></html>
